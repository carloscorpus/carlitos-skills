<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Modales con errores</title></head>
<body>
<button commandfor="fantasma" command="show-modal">Abre un modal que no existe</button>
<a href="#" data-modal-open="uno">Abrir uno</a>

<dialog id="uno" data-modal open data-modal-auto="delay" aria-describedby="falta">
    <h1>Título que no debería ser h1</h1>
    <img src="a.jpg">
    <iframe src="https://example.com/video"></iframe>
    <div tabindex="3">Orden de foco roto</div>
</dialog>

<dialog data-modal aria-label="Sin id">
    <form method="dialog"><button aria-label="Cerrar">x</button></form>
</dialog>

<dialog id="alerta" data-modal role="alertdialog" data-backdrop-close="true" aria-label="Alerta">
    <form method="dialog"><button aria-label="Cerrar">x</button></form>
</dialog>

<dialog id="viejo" aria-label="Sin el motor"></dialog>

<div role="dialog" id="uno">Falso diálogo</div>
</body>
</html>
