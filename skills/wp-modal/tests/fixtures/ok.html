<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Modales</title></head>
<body>
<main><h1>Página de prueba</h1>
<button type="button" aria-haspopup="dialog" aria-controls="promo" data-modal-open="promo" command="show-modal" commandfor="promo">Ver promoción</button>
<a href="/promocion/" aria-haspopup="dialog" aria-controls="promo" data-modal-open="promo">Ver promoción en su página</a>
<button type="button" aria-haspopup="dialog" aria-controls="confirmar" data-modal-open="confirmar" command="show-modal" commandfor="confirmar">Eliminar</button>
<button type="button" aria-haspopup="dialog" aria-controls="filtros" data-modal-open="filtros">Filtros</button>
</main>
<dialog id="promo" class="modal" data-modal data-size="lg" data-placement="center" data-mode="modal" data-backdrop-close="true" aria-labelledby="promo-title">
<div class="modal__panel">
<header class="modal__header">
<h2 id="promo-title" class="modal__title">Título de la promoción</h2>
<form method="dialog"><button type="submit" class="modal__close" aria-label="Cerrar"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
</header>
<div class="modal__body">
<img src="promo.jpg" alt="Descripción" width="640" height="480" loading="lazy">
<p>Texto.</p>
</div>
</div>
</dialog>
<dialog id="confirmar" class="modal" data-modal data-size="sm" data-placement="center" data-mode="modal" data-backdrop-close="false" role="alertdialog" aria-labelledby="confirmar-title" aria-describedby="confirmar-desc">
<div class="modal__panel">
<header class="modal__header">
<h2 id="confirmar-title" class="modal__title">¿Eliminar?</h2>
<form method="dialog"><button type="submit" class="modal__close" aria-label="Cerrar"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
</header>
<p id="confirmar-desc" class="modal__description">No se puede deshacer.</p>
<div class="modal__body">
<div class="modal__footer"><form method="dialog"><button type="submit" value="cancel" autofocus>Cancelar</button></form><a href="/eliminar/">Sí, eliminar</a></div>
</div>
</div>
</dialog>
<dialog id="filtros" class="modal" data-modal data-size="md" data-placement="right" data-mode="non-modal" data-backdrop-close="false" aria-labelledby="filtros-title">
<div class="modal__panel">
<header class="modal__header">
<h2 id="filtros-title" class="modal__title modal__title--hidden">Filtros</h2>
<form method="dialog"><button type="submit" class="modal__close" aria-label="Cerrar"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
</header>
<div class="modal__body">
<h3>Precio</h3>
</div>
</div>
</dialog>
<dialog id="oferta" class="modal" data-modal data-size="md" data-placement="center" data-mode="modal" data-backdrop-close="true" aria-labelledby="oferta-title" data-modal-auto="scroll" data-modal-delay="3000" data-modal-scroll="60" data-modal-min-width="768" data-modal-repeat="days:7">
<div class="modal__panel">
<header class="modal__header">
<h2 id="oferta-title" class="modal__title">Oferta</h2>
<form method="dialog"><button type="submit" class="modal__close" aria-label="Cerrar"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
</header>
<div class="modal__body">
<p>Oferta de bienvenida.</p>
</div>
</div>
</dialog>
</body>
</html>
